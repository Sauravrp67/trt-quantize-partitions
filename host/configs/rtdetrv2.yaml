onnx:
  input_name: images
  output_names: [pred_logits, pred_boxes]
  img_size: 640
  batch: 1
  default: fp32
defaults:
  device: cuda
  backends: [ort, trt]
  providers: [CUDAExecutionProvider, CPUExecutionProvider]
  score_thr: 0.5
  tf32: true
  warmup: 10
  timing_cache: ${engines}/timing_rtdetrv2_{backbone}.cache
outputs:
  figures: ${figures}/infer/rtdetrv2/{backbone}
  table: ${tables}/rtdetrv2_{backbone}_map.md
  export_artifacts: ${models}/rtdetrv2/artifacts/{backbone}
